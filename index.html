<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Schola | Elite AI Tutoring</title>
  <!-- Tailwind CSS is injected by Vite/PostCSS via local build, not CDN -->

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <!-- No importmap needed; Vite bundles all dependencies -->

  <!-- Unregister stale service workers and clear old caches.
       A previous build registered a SW that caches old JS chunks (e.g.
       MathTutor-B0aq64cR.js). Those stale chunks cause runtime errors when
       the app has been rebuilt but the SW keeps serving old files. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var reg of registrations) {
          reg.unregister();
          console.log('[Nova] Unregistered stale SW:', reg.scope);
        }
      });
      caches.keys().then(function(cacheNames) {
        cacheNames.forEach(function(name) {
          caches.delete(name);
          console.log('[Nova] Cleared cache:', name);
        });
      });
    }
  </script>

</head>

<body class="bg-stone-50 text-stone-900 antialiased selection:bg-teal-100 selection:text-teal-800">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
