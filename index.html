<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Schola | Elite AI Tutoring</title>
  <!-- Tailwind CSS is injected by Vite/PostCSS via local build, not CDN -->

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <!-- No importmap needed; Vite bundles all dependencies -->

  <!-- SW Nuke: kill any stale service worker (e.g. the old sw.js?v=1.2.0 that
       cached MathTutor-B0aq64cR.js). If an old SW is found we unregister it,
       wipe all caches, then force ONE clean reload so the app boots without
       any stale files. The second load finds no SW → skips → works normally. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        if (registrations.length === 0) return; // already clean

        console.log('[Nova] Found ' + registrations.length + ' stale SW(s) — nuking...');
        Promise.all(registrations.map(function(reg) {
          return reg.unregister();
        })).then(function() {
          return caches.keys().then(function(names) {
            return Promise.all(names.map(function(name) {
              console.log('[Nova] Clearing cache:', name);
              return caches.delete(name);
            }));
          });
        }).then(function() {
          console.log('[Nova] Done. Reloading for a clean start.');
          window.location.reload();
        });
      });
    }
  </script>

</head>

<body class="bg-stone-50 text-stone-900 antialiased selection:bg-teal-100 selection:text-teal-800">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
